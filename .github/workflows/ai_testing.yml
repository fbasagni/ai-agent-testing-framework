name: AI Evaluation Pipelines (QA Automation)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ai_eval_job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    - name: Run AI Evaluation Framework
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python projeto_qa_ia.py

    - name: Salvar Relatorio HTML (Artifact)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ai-evaluation-report
        path: relatorio_bugs_ia.html
        retention-days: 14